[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milaan"
version = "0.1.0"
description = "Do R and Python agree? A measured catalogue of where equivalent-looking statistical calls disagree, and what it takes to reconcile them."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = [
    "statistics",
    "differential-testing",
    "reproducibility",
    "replication",
    "cross-language",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
milaan = "milaan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/milaan"]
# The backend helpers under src/milaan/lib are data, not modules: they are read
# by R and by subprocess-launched Python, and the runner points at them through
# MILAAN_LIB. Living inside the package means an ordinary install carries them.

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests assert, and some of them spawn the very backends under test -- which is
# the only way to check that R and Python agree about anything.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "RUF012", "D"]
# Backend scripts are standalone programs run by subprocess: printing is the
# interface, they are not importable modules, and they must put the helper
# library on sys.path before importing it -- which is what E402 objects to.
"cases/**" = ["T20", "S", "D", "N", "INP", "E402"]
# Probes are the same kind of artifact: a script whose printed table is its
# interface, plus assertions that gate the claim.
"probes/**" = ["T20", "S", "D", "N", "INP", "E402"]
"backends/**" = ["T20", "S", "D", "N", "INP", "E402"]
"src/milaan/lib/**" = ["T20", "S", "D", "N", "INP"]
"datasets/**" = ["T20", "INP"]

[tool.pytest.ini_options]
# cases/ and probes/ carry the findings, and they were not collected until now,
# so nothing ran them. The finding assertions are written the way they would be
# written if the claim held and are marked xfail(strict=True): they fail today,
# which is the point, and if a package ever fixes its default the test starts
# passing and CI goes red, forcing the case to be rewritten. A corpus about
# silent staleness must not go stale silently.
testpaths = ["tests", "cases", "probes"]
# Explicit filenames, not a glob. The backend scripts under cases/ (run_py.py,
# run_sm.py, run_sklearn.py) have no `__main__` guard because they are meant to
# be run by subprocess -- a pattern like "*_py.py" would import and therefore
# EXECUTE them during collection.
python_files = ["test_*.py", "gate.py", "coverage_py.py", "size_py.py"]
# Every probe names its gate `gate.py`, and several cases name their study
# `coverage_py.py`. Under the default import mode those collide -- pytest
# derives a module name from the basename and refuses the second one. importlib
# mode gives each file a unique module identity without requiring __init__.py
# in every probe directory.
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = ["src"]
markers = [
    "slow: runs R and Python subprocesses; run with -m slow",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pydoclint>=0.5",
    "ruff>=0.14",
    "pyright>=1.1.390",
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "pytest-cov>=6",
    # A git reference, so it stays in dependency-groups and out of any published
    # extras: PyPI rejects direct URL references in project metadata.
    "simcheck @ git+https://github.com/finite-sample/simcheck",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
