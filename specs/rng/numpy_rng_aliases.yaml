id: numpy_rng_aliases
family: rng
title: "Four ways to write the same draw, and they are the same draw"
quantity: "three normal and three uniform draws after seeding with 42"
reference: np_canonical
covers:
  - randn
  - rand
  - standard_normal
  - RandomState
  - random
  - normal
  - uniform
  - seed

implementations:
  np_canonical:
    lang: Python
    setup: "np.random.seed(42)"
    expr: >
      dict(zip(['n1', 'n2', 'n3'], np.random.standard_normal(3))) |
      dict(zip(['u1', 'u2', 'u3'], np.random.random(3)))
    label: "numpy: standard_normal, random"
  np_short:
    lang: Python
    setup: "np.random.seed(42)"
    expr: >
      dict(zip(['n1', 'n2', 'n3'], np.random.randn(3))) |
      dict(zip(['u1', 'u2', 'u3'], np.random.rand(3)))
    label: "numpy: randn, rand"
  np_verbose:
    lang: Python
    setup: "np.random.seed(42)"
    expr: >
      dict(zip(['n1', 'n2', 'n3'], np.random.normal(0, 1, 3))) |
      dict(zip(['u1', 'u2', 'u3'], np.random.uniform(0, 1, 3)))
    label: "numpy: normal(0,1), uniform(0,1)"
  np_randomstate:
    lang: Python
    setup: "rs = np.random.RandomState(42)"
    expr: >
      dict(zip(['n1', 'n2', 'n3'], rs.standard_normal(3))) |
      dict(zip(['u1', 'u2', 'u3'], rs.random_sample(3)))
    label: "numpy: RandomState(42) object"

finding:
  cause: DEFINITION
  reconcilable: true
  reconciliation: "nothing to do; these are four spellings of one generator"
  note: >
    The necessary companion to seeded_streams, and the reason its finding is not
    an artefact of which numpy API was chosen. `randn`, `standard_normal`,
    `normal(0, 1)`, and a `RandomState` object all draw from the same
    Mersenne-Twister state in the same order, and so do `rand`, `random`, and
    `uniform(0, 1)`. Every one of these is byte-identical to the others.

    That matters for coverage as much as for the finding: `randn` is the single
    most-called Python function in the corpus at 316 scripts, `seed` at 252, and
    `RandomState` at 230. They are not three separate things to test. They are
    one stream with three names, and none of them reproduces R's.

    Note what is *not* in this list: `default_rng`, which is a different bit
    generator entirely and is compared in seeded_streams.
